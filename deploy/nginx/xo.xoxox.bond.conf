# ==============================================================================
# XO Studio (xo.xoxox.bond) - 生产级严密加密与源站防探测 Nginx 部署配置
# 1. 彻底防御 H1 源站 IP 直连 / Host 头绕过 Cloudflare 攻击
# 2. 封杀裸 IP 扫描探测（Shodan/Censys/ZoomEye 无法识别源站）
# 3. 强制 TLS 1.2 / TLS 1.3 现代高强度前向保密加密套件，封死 CBC 弱套件
# 4. 原生全站 HSTS 与安全响应头硬化
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 默认黑洞 Server（Catch-All Default Server）
# 针对通过裸 IP 直连、扫描探测、或未知 Host 头的所有请求，直接返回 444 丢弃连接
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    # 配合自签名或假证书直接断开未知握手
    ssl_reject_handshake on;
}

# ------------------------------------------------------------------------------
# 2. HTTP 强制 301 永久重定向至 HTTPS 加密协议
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xo.xoxox.bond;
    server_tokens off;

    # 包含 Cloudflare 回源白名单
    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 3. 核心 HTTPS 加密站点配置
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xo.xoxox.bond;
    server_tokens off;

    # 严格限制仅放行 Cloudflare 边缘节点回源（阻断公网攻击者绕过 CDN 直连源站）
    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    # 可选：开启 Cloudflare Authenticated Origin Pulls (mTLS 证书互认)
    # ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # SSL 证书与私钥路径（Let's Encrypt 或 Cloudflare Origin CA）
    ssl_certificate /etc/letsencrypt/live/xoxox.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xoxox.bond/privkey.pem;

    # 强制仅使用 TLS 1.2 和 TLS 1.3，彻底禁用 TLS 1.0、1.1（杜绝弱 CBC 套件）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # 会话缓存与超时安全调优
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling 证书在线状态校验
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # 传输层最高级别安全响应头硬化
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 隐藏代理及上游技术指纹
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Nitro-Version;
    proxy_hide_header Server;

    # 客户端上传限制
    client_max_body_size 500M;

    # 禁止访问隐藏文件及内部构建产物
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (sql_dump\.txt|__nuxt_content) {
        return 404;
    }

    # 反向代理至 Nuxt Node.js 服务端 (默认 3000 端口)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
