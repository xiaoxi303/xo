# ==============================================================================
# XO Studio (xo.xoxox.bond) - Cloudflare 原生无缝代理与源站防御 Nginx 配置
# 1. 完美适配 Cloudflare 橙色云朵 (Proxied) 与通用 SSL 自动续期
# 2. 兼容 Cloudflare Flexible (HTTP 80) 与 Full / Full Strict (HTTPS 443) 模式
# 3. 彻底防御裸 IP 直连与扫描探测 (默认黑洞 444)
# 4. 自动恢复客户端真实 IP (基于 CF-Connecting-IP)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 默认黑洞 Server（Catch-All Default Server）
# 针对通过裸 IP 直连、扫描探测、或未知 Host 头的所有请求，直接返回 444 丢弃连接
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/ssl/xo/origin.crt;
    ssl_certificate_key /etc/ssl/xo/origin.key;
    return 444;
}

# ------------------------------------------------------------------------------
# 2. Apex 根域名与 www (xoxox.bond / www.xoxox.bond) 跳转至主站 xo.xoxox.bond
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xoxox.bond www.xoxox.bond;
    server_tokens off;

    include /etc/nginx/snippets/cloudflare-ips.conf;

    ssl_certificate /etc/ssl/xo/origin.crt;
    ssl_certificate_key /etc/ssl/xo/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://xo.xoxox.bond$request_uri;
}

# ------------------------------------------------------------------------------
# 3. 核心主站配置 (xo.xoxox.bond)
# 同时监听 80 与 443，无论 Cloudflare 设置为 Flexible 还是 Full 均可秒速通信
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xo.xoxox.bond;
    server_tokens off;

    # 识别 Cloudflare 边缘节点并精准恢复真实客户端 IP
    include /etc/nginx/snippets/cloudflare-ips.conf;

    # SSL 证书 (优先读取 Cloudflare Origin / Let's Encrypt / 自动生成的自签回源证书)
    ssl_certificate /etc/ssl/xo/origin.crt;
    ssl_certificate_key /etc/ssl/xo/origin.key;

    # 强制现代高强度安全加密协议与套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 传输层最高级别安全响应头硬化
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 隐藏代理及上游技术指纹
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Nitro-Version;
    proxy_hide_header Server;

    # 客户端上传限制
    client_max_body_size 500M;

    # 禁止访问隐藏文件及内部构建产物
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (sql_dump\.txt|__nuxt_content) {
        return 404;
    }

    # 反向代理至 Nuxt Node.js 服务端 (监听端口 3007)
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
